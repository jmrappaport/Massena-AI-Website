<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="sky" cx="150" cy="150" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset=".28" stop-color="#ffd54a"/>
      <stop offset=".55" stop-color="#f7a823"/>
      <stop offset=".8" stop-color="#6fb6e6"/>
      <stop offset="1" stop-color="#2f80c8"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc3ec"/>
      <stop offset="1" stop-color="#1a66b0"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a74c4"/>
      <stop offset="1" stop-color="#143f8a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4fa0"/>
      <stop offset="1" stop-color="#0f2f6e"/>
    </linearGradient>
    <clipPath id="scene"><circle cx="150" cy="145" r="97"/></clipPath>
  </defs>

  <!-- compass points -->
  <g fill="#0f2f6e">
    <polygon points="150,10 139,42 161,42"/>
    <polygon points="290,145 258,134 258,156"/>
    <polygon points="10,145 42,134 42,156"/>
  </g>
  <g fill="#2a74c4">
    <polygon points="245,50 222,62 233,73"/>
    <polygon points="55,50 78,62 67,73"/>
  </g>

  <!-- rings -->
  <circle cx="150" cy="145" r="112" fill="url(#ring)"/>
  <circle cx="150" cy="145" r="105" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="150" cy="145" r="101" fill="#3a9b45"/>
  <circle cx="150" cy="145" r="98" fill="#ffffff"/>

  <!-- scene -->
  <g clip-path="url(#scene)">
    <rect x="40" y="40" width="220" height="220" fill="url(#sky)"/>
    <!-- sun rays -->
    <g stroke="#fff3b0" stroke-width="3" stroke-linecap="round" opacity=".75">
      <line x1="150" y1="118" x2="150" y2="88"/>
      <line x1="128" y1="124" x2="112" y2="98"/>
      <line x1="172" y1="124" x2="188" y2="98"/>
      <line x1="112" y1="138" x2="86" y2="124"/>
      <line x1="188" y1="138" x2="214" y2="124"/>
    </g>
    <circle cx="150" cy="150" r="24" fill="#fff8d6"/>
    <!-- birds -->
    <g fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round">
      <path d="M96 84 q6 -6 12 0 q6 -6 12 0"/>
      <path d="M178 70 q5 -5 10 0 q5 -5 10 0"/>
    </g>
    <!-- far shore -->
    <path d="M40 160 C80 146 110 152 150 156 C190 160 222 146 260 154 L260 175 L40 175 Z" fill="#2f7d3a"/>
    <!-- trees left -->
    <g fill="#1f5e2b">
      <polygon points="70,160 82,118 94,160"/>
      <polygon points="88,162 98,130 108,162"/>
      <rect x="80" y="158" width="4" height="8"/>
    </g>
    <!-- tree right -->
    <g fill="#2a7a36">
      <circle cx="222" cy="136" r="16"/>
      <circle cx="236" cy="146" r="13"/>
      <circle cx="208" cy="148" r="12"/>
    </g>
    <rect x="220" y="148" width="4" height="14" fill="#5a3b1e"/>
    <!-- river -->
    <rect x="40" y="166" width="220" height="80" fill="url(#river)"/>
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".7" fill="none">
      <path d="M66 176 q8 -4 16 0 t16 0"/>
      <path d="M186 180 q8 -4 16 0 t16 0"/>
    </g>
    <!-- crossed hockey sticks + puck -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M114 102 L156 160 L170 160" fill="none" stroke="#0f2f6e" stroke-width="7"/>
      <path d="M186 102 L144 160 L130 160" fill="none" stroke="#0f2f6e" stroke-width="7"/>
      <path d="M114 102 L156 160 L170 160" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M186 102 L144 160 L130 160" fill="none" stroke="#ffffff" stroke-width="3"/>
    </g>
    <ellipse cx="150" cy="169" rx="11" ry="4.5" fill="#111d33"/>
  </g>

  <!-- main banner -->
  <path d="M30 186 L50 180 L250 180 L270 186 L262 202 L270 218 L250 224 L50 224 L30 218 L38 202 Z" fill="#0f2f6e"/>
  <path d="M46 182 L254 182 L254 222 L46 222 Z" fill="url(#banner)" stroke="#ffffff" stroke-width="2.5"/>
  <text x="150" y="214" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="31" letter-spacing="1" fill="#ffffff">MASSENA</text>

  <!-- sub banner -->
  <path d="M64 222 L236 222 L227 249 L73 249 Z" fill="#0f2f6e" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="241.5" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17" letter-spacing="2.2" fill="#ffffff">RECREATION</text>
</svg>
